<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 节点探针</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeafe 0%, #f0f9ff 35%, #fce7f3 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      position: relative; overflow: hidden;
    }
    body::before, body::after {
      content: ''; position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: .4; pointer-events: none;
    }
    body::before { width: 400px; height: 400px; background: #93c5fd; top: -100px; left: -100px; }
    body::after { width: 500px; height: 500px; background: #f9a8d4; bottom: -150px; right: -100px; }

    .login-card {
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, .6);
      border-radius: 20px; padding: 40px;
      width: 380px; max-width: calc(100vw - 32px);
      box-shadow: 0 20px 60px rgba(15, 23, 42, .15);
    }
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 32px; color: #fff;
      box-shadow: 0 8px 20px rgba(59, 130, 246, .35);
      margin-bottom: 16px;
    }
    .login-title { font-size: 22px; font-weight: 700; color: #1f2937; margin: 0 0 4px; }
    .login-subtitle { font-size: 13px; color: #6b7280; margin: 0; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 13px; color: #374151;
      font-weight: 500; margin-bottom: 6px;
    }
    .form-group input {
      width: 100%; padding: 11px 14px;
      background: #fff; color: #1f2937;
      border: 1px solid #d1d5db; border-radius: 10px;
      outline: none; font-size: 14px; box-sizing: border-box;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
    }
    .form-group input::placeholder { color: #9ca3af; }

    .login-btn {
      width: 100%; margin-top: 22px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, .35);
      transition: transform .1s, box-shadow .15s;
    }
    .login-btn:hover { box-shadow: 0 6px 18px rgba(59, 130, 246, .5); }
    .login-btn:active { transform: translateY(1px); }
    .login-btn:disabled { opacity: .5; cursor: not-allowed; }

    .login-error {
      color: #dc2626; background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 8px; padding: 8px 12px;
      font-size: 13px; margin-top: 14px;
      display: none;
    }
    .login-error.show { display: block; }

    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 12px; color: #9ca3af;
    }
    .login-footer a { color: #6b7280; text-decoration: none; }
    .login-footer a:hover { color: #3b82f6; }
  </style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-header">
      <div class="login-logo">🌐</div>
      <h1 class="login-title">节点探针</h1>
      <p class="login-subtitle">管理员登录</p>
    </div>

    <div class="form-group">
      <label for="user">用户名</label>
      <input type="text" id="user" autocomplete="username" placeholder="admin" required autofocus>
    </div>
    <div class="form-group">
      <label for="pass">密码</label>
      <input type="password" id="pass" autocomplete="current-password" placeholder="••••••" required>
    </div>

    <button class="login-btn" type="submit" id="loginBtn">登录</button>

    <div class="login-error" id="errBox"></div>

    <div class="login-footer">
      <a href="/">← 返回公开视图</a>
    </div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const btn = document.getElementById('loginBtn');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.add('show');
    }
    function hideError() {
      errBox.textContent = '';
      errBox.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      const user = document.getElementById('user').value.trim();
      const pass = document.getElementById('pass').value;
      if (!user || !pass) { showError('请填写完整'); return; }
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass }),
        });
        if (r.status === 401) { showError('用户名或密码错误'); return; }
        if (!r.ok) { showError('登录失败: ' + r.statusText); return; }
        const d = await r.json();
        sessionStorage.setItem('token', d.token);
        location.href = '/admin';
      } catch (err) {
        showError('网络错误: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = '登录';
      }
    });

    // 已登录直接跳转
    if (sessionStorage.getItem('token')) location.href = '/admin';
  </script>
</body>
</html>
